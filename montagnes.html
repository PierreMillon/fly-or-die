<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les montagnes — Fly or Die</title>
<style>
  :root { --bg:#04070a; --line:#46ffa0; --text:#8ffcc4; --dim:#1d4a36; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #haut { position:fixed; top:0; left:0; right:0; padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:rgba(4,7,10,.82); z-index:5; }
  #nom { font-size:12px; letter-spacing:.16em; color:var(--line); }
  #quoi { font-size:11px; color:var(--dim); line-height:1.45; margin-top:2px; }
  #bas { position:fixed; bottom:0; left:0; right:0; z-index:5;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(4,7,10,.82); display:flex; gap:6px; flex-wrap:wrap; }
  button { flex:1 1 auto; min-width:2.6rem; background:transparent; border:1px solid var(--dim);
    border-radius:4px; color:var(--text); font-family:inherit; font-size:13px;
    letter-spacing:.12em; padding:11px 4px; }
  button.actif { border-color:var(--line); color:var(--line); }
  #aide { position:fixed; left:10px; right:10px; bottom:74px; z-index:4;
    font-size:11px; color:var(--dim); line-height:1.4; text-align:center; }
</style>
</head>
<body>
<div id="haut">
  <div id="nom"></div>
  <div id="quoi"></div>
</div>
<div id="aide">Glisse pour regarder autour. Deux doigts pour monter ou descendre.</div>
<div id="bas"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// LE MÊME TERRAIN QUE LE JEU, AUX MÊMES NOMBRES.
//
// Cette page ne sert qu'à une chose : trancher, sur des images, ce que doivent
// être les montagnes. Elle ne modifie pas le jeu et le jeu ne la lit pas — mais
// elle en recopie le terrain au chiffre près, sinon on choisirait sur une
// maquette et on retomberait sur le même problème.
// ---------------------------------------------------------------------------
const COL_BG = 0x04070a, COL_LINE = 0x46ffa0;
const GRID_SPAN = 8400, GRID_STEP = 160;
const TERRAIN_R0 = 2400, TERRAIN_R1 = 5600, TERRAIN_R2 = 7200, TERRAIN_R3 = 8800;
const TERRAIN_H = 980;

function hauteurSol(x, z) {
  const d = Math.hypot(x, z);
  if (d <= TERRAIN_R0 || d >= TERRAIN_R3) return 0;
  let k;
  if (d < TERRAIN_R1) k = (d - TERRAIN_R0) / (TERRAIN_R1 - TERRAIN_R0);
  else if (d <= TERRAIN_R2) k = 1;
  else k = 1 - (d - TERRAIN_R2) / (TERRAIN_R3 - TERRAIN_R2);
  if (k > 1) k = 1; else if (k < 0) k = 0;
  k = k * k * (3 - 2 * k);
  const n = Math.sin(x / 640) * Math.cos(z / 517)
          + 0.55 * Math.sin(x / 263 + 1.7) * Math.cos(z / 311 - 0.4)
          + 0.28 * Math.sin((x + z) / 149 + 2.6);
  const u = (n / 1.83 + 1) / 2;
  return k * TERRAIN_H * u * u;
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(COL_BG, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(COL_BG, 0.00052);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 1, 20000);

// LA GRILLE, exactement comme batisGrille() : chaque tronçon suit le relief.
function batisGrille(cx, cz) {
  const pts = [], R = GRID_SPAN / 2;
  for (let i = -R; i <= R; i += GRID_STEP) {
    for (let j = -R; j < R; j += GRID_STEP) {
      pts.push(cx + i, hauteurSol(cx + i, cz + j), cz + j,
               cx + i, hauteurSol(cx + i, cz + j + GRID_STEP), cz + j + GRID_STEP);
      pts.push(cx + j, hauteurSol(cx + j, cz + i), cz + i,
               cx + j + GRID_STEP, hauteurSol(cx + j + GRID_STEP, cz + i), cz + i);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return g;
}

// LE RELIEF PLEIN, exactement comme batisRelief() — avec un décalage vertical
// réglable, parce que c'est précisément ce qu'on vient mettre à l'épreuve.
function batisRelief(cx, cz, dy, teinte) {
  const R = GRID_SPAN / 2, N = GRID_SPAN / GRID_STEP;
  const pos = new Float32Array((N + 1) * (N + 1) * 3);
  const col = new Float32Array((N + 1) * (N + 1) * 3);
  const bas = new THREE.Color(COL_BG), haut = new THREE.Color(teinte);
  let p = 0, q = 0;
  for (let j = 0; j <= N; j++) {
    for (let i = 0; i <= N; i++) {
      const x = cx - R + i * GRID_STEP, z = cz - R + j * GRID_STEP;
      const h = hauteurSol(x, z);
      pos[p++] = x; pos[p++] = h + dy; pos[p++] = z;
      const uh = Math.max(0, Math.min(1, (h - 150) / (TERRAIN_H - 150)));
      const u = uh * uh;
      col[q++] = bas.r + (haut.r - bas.r) * u;
      col[q++] = bas.g + (haut.g - bas.g) * u;
      col[q++] = bas.b + (haut.b - bas.b) * u;
    }
  }
  const idx = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
}

const matGrille = new THREE.LineBasicMaterial({ color: COL_LINE, transparent: true, opacity: 0.62, fog: true });
const grille = new THREE.LineSegments(batisGrille(0, 0), matGrille);
grille.frustumCulled = false;
scene.add(grille);

const matRelief = new THREE.MeshBasicMaterial({ vertexColors: true, fog: false,
  depthWrite: true, side: THREE.DoubleSide });
const relief = new THREE.Mesh(batisRelief(0, 0, -4, 0x0f2a1d), matRelief);
relief.frustumCulled = false;
relief.renderOrder = -0.4;
scene.add(relief);

// ---------------------------------------------------------------------------
// LES VARIANTES. Chacune ne change qu'une chose, et le nom dit laquelle.
// ---------------------------------------------------------------------------
const VAR = [
  { c:'A', nom:"A — CE QUE TU VOIS AUJOURD'HUI",
    quoi:"Le relief plein est quatre mètres SOUS les traits, en vert très sombre, "
       + "et ses deux faces sont peintes.",
    dy:-4, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00052 },
  { c:'B', nom:"B — LE RELIEF REMONTE AU NIVEAU DES TRAITS",
    quoi:"Il était quatre mètres dessous : sur une pente, ça laisse passer les "
       + "traits d'en face. Là il est pile à la surface.",
    dy:0, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00052 },
  { c:'C', nom:"C — LE RELIEF PASSE DEVANT LES TRAITS",
    quoi:"Un mètre AU-DESSUS de la surface : il mange un peu les traits proches, "
       + "mais rien de ce qui est derrière ne peut plus passer.",
    dy:1, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00052 },
  { c:'D', nom:"D — UNE SEULE FACE",
    quoi:"On ne peint plus le dos des triangles. Le revers des crêtes disparaît, "
       + "mais des trous peuvent s'ouvrir là où la pente s'éloigne.",
    dy:-4, teinte:0x0f2a1d, face:THREE.FrontSide, brouillard:0.00052 },
  { c:'E', nom:"E — DU BROUILLARD SUR LES TRAITS",
    quoi:"Le relief ne bouge pas ; c'est le lointain qui fond dans le ciel. "
       + "Les crêtes proches se détachent des autres.",
    dy:-4, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00125 },
  { c:'F', nom:"F — DEVANT LES TRAITS, ET DU BROUILLARD",
    quoi:"C et E ensemble : plus rien ne traverse, et la profondeur se lit.",
    dy:1, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00105 },
  { c:'G', nom:"G — LE CORPS PLUS FRANC",
    quoi:"Comme F, mais la masse des sommets est deux fois plus visible. "
       + "Une montagne qu'on ne peut pas confondre avec le ciel.",
    dy:1, teinte:0x1d4a33, face:THREE.DoubleSide, brouillard:0.00105 },
  { c:'H', nom:"H — SANS CORPS DU TOUT",
    quoi:"Le relief plein est retiré. C'est le dessin au trait pur, "
       + "sans rien qui cache : pour comparer, et pour se rappeler d'où on vient.",
    dy:-4, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00052, sansRelief:true },
  { c:'I', nom:"I — LE CORPS BIEN PLUS BAS",
    quoi:"Quarante mètres sous la surface au lieu de quatre. À trois kilomètres "
       + "et en rasant, quatre mètres sont sous la résolution du tampon de "
       + "profondeur : la surface et les traits se battent, et le gagnant change "
       + "d'un endroit à l'autre. C'est ma meilleure explication de ce que tu vois.",
    dy:-40, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00052 },
  { c:'J', nom:"J — LES TRAITS POUSSÉS DEVANT",
    quoi:"Le corps reste où il est, mais on dit à la carte de le repousser d'un "
       + "cran en profondeur. Même idée que I, réglée du bon côté : les traits "
       + "gagnent toujours, le corps cache toujours.",
    dy:-4, teinte:0x0f2a1d, face:THREE.DoubleSide, brouillard:0.00052, offset:true },
  { c:'K', nom:"K — LES DEUX, ET LE CORPS FRANC",
    quoi:"Corps quarante mètres dessous, traits poussés devant, masse des sommets "
       + "bien visible. Si celle-ci est juste, c'est celle-là qu'on met.",
    dy:-40, teinte:0x1d4a33, face:THREE.DoubleSide, brouillard:0.00075, offset:true }
];
let actuel = 0, dyActuel = -4, teinteActuelle = 0x0f2a1d;

function applique(i) {
  const V = VAR[i];
  actuel = i;
  if (V.dy !== dyActuel || V.teinte !== teinteActuelle) {
    relief.geometry.dispose();
    relief.geometry = batisRelief(0, 0, V.dy, V.teinte);
    dyActuel = V.dy; teinteActuelle = V.teinte;
  }
  matRelief.side = V.face;
  // LE DÉCALAGE DE PROFONDEUR. Il repousse la surface d'un cran DERRIÈRE
  // elle-même : ce qui est dessus gagne toujours, sans rien déplacer.
  matRelief.polygonOffset = !!V.offset;
  matRelief.polygonOffsetFactor = V.offset ? 1.4 : 0;
  matRelief.polygonOffsetUnits = V.offset ? 6 : 0;
  matRelief.needsUpdate = true;
  relief.visible = !V.sansRelief;
  scene.fog.density = V.brouillard;
  document.getElementById('nom').textContent = V.nom;
  document.getElementById('quoi').textContent = V.quoi;
  for (const b of document.querySelectorAll('#bas button'))
    b.classList.toggle('actif', b.textContent === V.c);
}

const bas = document.getElementById('bas');
VAR.forEach((V, i) => {
  const b = document.createElement('button');
  b.textContent = V.c;
  b.addEventListener('click', () => applique(i));
  bas.appendChild(b);
});

// ---------------------------------------------------------------------------
// LE POINT DE VUE : celui de sa capture — au-dessus de la chaîne, regard loin.
// ---------------------------------------------------------------------------
// PLUS BAS ET PLUS PRÈS QUE MON PREMIER ESSAI. À quatre cent trente mètres et
// regard à l'horizontale, tout le relief est à plus de deux kilomètres, donc
// effacé à quatre-vingt-dix pour cent par le brouillard : l'écran était noir et
// je ne montrais rien. Deux cent soixante mètres, nez légèrement baissé : les
// crêtes proches sont à quelques centaines de mètres, comme sur sa capture.
// DANS LES VRAIES MONTAGNES. Mes deux premiers essais étaient dans les
// contreforts, où le relief ne fait que quelques dizaines de mètres : je
// comparais des variantes sur un terrain plat. Le massif est à pleine amplitude
// entre 5 600 et 7 200 mètres du centre.
const vue = { x: 0, z: -6000, h: 320, cap: Math.PI, pente: -0.12 };
function poseCamera() {
  camera.position.set(vue.x, hauteurSol(vue.x, vue.z) + vue.h, vue.z);
  const e = new THREE.Euler(vue.pente, vue.cap, 0, 'YXZ');
  camera.quaternion.setFromEuler(e);
}

let doigt = null, deuxDoigts = false;
renderer.domElement.addEventListener('pointerdown', e => { doigt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointermove', e => {
  if (!doigt) return;
  vue.cap -= (e.clientX - doigt.x) * 0.004;
  vue.pente = Math.max(-0.8, Math.min(0.5, vue.pente - (e.clientY - doigt.y) * 0.003));
  doigt = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', () => { doigt = null; });
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2) { deuxDoigts = true; doigt = { y: e.touches[0].clientY }; }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
  if (deuxDoigts && e.touches.length === 2 && doigt) {
    vue.h = Math.max(40, Math.min(2200, vue.h + (doigt.y - e.touches[0].clientY) * 3));
    doigt = { y: e.touches[0].clientY };
  }
}, { passive: true });
window.addEventListener('touchend', () => { deuxDoigts = false; });
window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

applique(0);
(function boucle() {
  poseCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
